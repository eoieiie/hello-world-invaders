name: PR title

# Checks that a pull request title follows our commit format, because the
# title becomes the squash commit on main. See CONTRIBUTING.md.
#   format:  type: subject   or   type(scope): subject
#   types:   feat fix docs refactor test ci chore style
# A wrong format fails the check. A title over 50 characters only warns.
# Runs only in the team repository.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

jobs:
  title:
    if: github.repository == 'eoieiie/hello-world-invaders'
    runs-on: ubuntu-latest
    steps:
      - name: Check title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|refactor|test|ci|chore|style)(\([a-z0-9-]+\))?: [^ ](.*[^.])?$'
          if [[ ! "$TITLE" =~ $pattern ]]; then
            echo "::error title=PR title format::Expected 'type: subject' (types: feat fix docs refactor test ci chore style), no full stop at the end. Got: $TITLE"
            exit 1
          fi
          if (( ${#TITLE} > 50 )); then
            echo "::warning title=PR title length::${#TITLE} characters. Try to keep it under 50, since it becomes the commit title on main."
          fi
          echo "OK: $TITLE"

      - name: Check Jira link
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BRANCH: ${{ github.head_ref }}
        run: |
          key_pattern='(^|[^[:alnum:]_])HW-[0-9]+([^[:alnum:]_]|$)'
          if ! [[ "$PR_BODY" =~ $key_pattern ]]; then
            echo '::error::Add the uppercase Jira key (HW-123) to the PR description.'
            exit 1
          fi
          if ! [[ "$BRANCH" =~ ^hello-world/HW-[0-9]+-[a-z0-9-]+$ ]]; then
            echo '::warning::Use hello-world/HW-123-short-name for new branches.'
          fi
